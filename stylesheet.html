<style>
  :root {
    --ink: #f5f1e6;
    --ink-soft: #c9d3e8;
    --lapis: #1f4e8c;
    --lapis-dark: #0a1424;
    --gold: #d9a441;
    --gold-deep: #b8862b;
    --base: #0e1a2e;
    --base-panel: #172a47;
    --red: #e2543f;
    --border: #2e4a73;
  }
  body { font-family: 'Noto Serif', serif; background: var(--base); margin:0; padding-bottom: 104px; }

  /* ---------- Login screen ---------- */
  #login-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at top, #1b3a66 0%, #0f1f3a 55%, #070d19 100%);
    padding: 20px;
  }
  #login-overlay.hidden { display: none; }
  .login-card {
    width: 100%; max-width: 440px;
    background: var(--base-panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(2,5,12,.55);
    padding: 36px 34px 30px;
    text-align: center;
  }
  .login-card .crest {
    width: 56px; height: 56px; margin: 0 auto 14px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--gold), var(--lapis));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 14px rgba(31,78,140,.45);
  }
  .login-card h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    color: var(--gold);
    letter-spacing: .03em;
    margin: 0 0 4px;
  }
  .login-card p.subtitle {
    color: var(--ink-soft);
    font-size: .92rem;
    margin: 0 0 26px;
  }
  .field-group { text-align: left; margin-bottom: 16px; }
  .field-group label {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: .72rem;
    letter-spacing: .06em;
    color: var(--gold-deep);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .field-group input,
  .field-group select {
    width: 100%;
    box-sizing: border-box;
    font-family: 'Noto Serif', serif;
    font-size: 1rem;
    color: var(--ink);
    background: #0a1426;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 11px 13px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field-group input::placeholder { color: #7f93b5; }
  .field-group input:focus,
  .field-group select:focus {
    border-color: var(--gold-deep);
    box-shadow: 0 0 0 3px rgba(184,134,43,.25);
  }
  .field-group select { cursor: pointer; }
  #login-error {
    color: var(--red);
    font-size: .85rem;
    min-height: 1.2em;
    margin: -4px 0 12px;
    text-align: left;
  }
  #login-submit {
    width: 100%;
    font-family: 'Playfair Display', serif;
    letter-spacing: .03em;
    font-size: .95rem;
    color: #0a1424;
    background: linear-gradient(135deg, var(--gold) 0%, #7a5614 100%);
    border: none;
    border-radius: 10px;
    padding: 13px 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 6px 16px rgba(217,164,65,.28);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  #login-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(217,164,65,.36); }
  #login-submit:active { transform: translateY(0); }

  /* ---------- Login screen extra links (data sheet / leaderboard) ---------- */
  .login-extra-links {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .data-sheet-link,
  .leaderboard-link-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Noto Serif', serif;
    font-size: .85rem;
    color: var(--gold-deep);
    background: none;
    border: none;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 2px 0;
  }
  .data-sheet-link:hover,
  .leaderboard-link-btn:hover { color: var(--gold); }

  /* ---------- Logged-in badge shown inside the app ---------- */
  #student-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--base-panel);
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-size: .85rem;
    padding: 6px 12px;
    border-radius: 999px;
    margin: 0 auto 18px;
    width: fit-content;
  }
  #student-badge b { color: var(--gold); font-family: 'Playfair Display', serif; font-size: .8rem; letter-spacing: .02em; }
  #student-badge button {
    background: none; border: none; color: var(--gold-deep);
    text-decoration: underline; cursor: pointer; font-size: .8rem; font-family: inherit;
    margin-left: 4px; padding: 0;
  }

  #app-content.hidden { display: none; }

  /* ---------- Outline buttons (Data Sheet / Leaderboard, quiz toolbar) ---------- */
  .canva-button-outline {
    display: inline-flex;
    align-items: center;
    background: #172a47;
    color: var(--ink);
    border: 1.5px solid var(--border);
    font-family: 'Noto Serif', serif;
    font-size: .9rem;
    text-decoration: none;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .canva-button-outline:hover {
    background: rgba(217,164,65,.12);
    border-color: var(--gold-deep);
  }

  /* ---------- Sound-focus tip banner (Thai learner L/R, S, W/V cues) ---------- */
  .sound-tip {
    background: rgba(31,78,140,.28);
    border: 1px solid var(--border);
    border-left: 4px solid var(--gold);
  }
  .sound-tip-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'Playfair Display', serif;
    font-size: .82rem;
    letter-spacing: .02em;
    color: var(--gold);
    margin-bottom: 5px;
  }
  .sound-tip-body {
    color: var(--ink);
    font-size: .88rem;
    margin: 0;
  }
  .sound-tip-body b { color: var(--gold); }

  /* ---------- Quiz word-tagging styles (recolored for the Southwest Asia lapis/gold theme) ---------- */
  .word-token {
    position: relative;
    display: inline;
    cursor: pointer;
    border-radius: 3px;
    padding: 0 1px;
    transition: background-color .15s ease, color .15s ease;
  }
  .word-token:hover { background-color: rgba(217,164,65,.20); }
  .word-token:focus-visible { outline: 2px solid #d9a441; outline-offset: 1px; }
  .word-token.tagged {
    background-color: rgba(217,164,65,.20);
    text-decoration: underline wavy #d9a441;
    text-underline-offset: 3px;
    font-weight: 600;
    /* Keeps a tagged word legible the moment it's tagged, rather than
       relying on a dark color that nearly vanishes against this
       translucent gold highlight on the dark theme. */
    color: #f3dc9f;
  }
  .word-token.open { background-color: rgba(217,164,65,.35); }
  .tag-label {
    display: inline-block;
    font-family: 'Playfair Display', serif;
    font-size: .58em;
    line-height: 1;
    vertical-align: super;
    margin-right: 2px;
    padding: 1px 4px;
    border-radius: 4px;
    background: #1f4e8c;
    color: #f5f1e6;
    letter-spacing: .03em;
    font-weight: 700;
    white-space: nowrap;
  }
  .word-token.reveal-correct {
    background-color: rgba(90,168,140,.22);
    text-decoration: underline wavy #5aa88c;
    text-underline-offset: 3px;
    color: #a7ddc7; font-weight: 600; cursor: default;
  }
  .word-token.reveal-correct .tag-label { background:#357a63; }
  .word-token.reveal-partial {
    background-color: rgba(217,164,65,.24);
    text-decoration: underline wavy #d9a441;
    text-underline-offset: 3px;
    color: #f0d79a; font-weight: 600; cursor: default;
  }
  .word-token.reveal-partial .tag-label { background:#b8862b; }
  .word-token.reveal-wrong {
    background-color: rgba(196,110,90,.24);
    text-decoration: line-through #c46e5a;
    color: #f0ac93; cursor: default;
  }
  .word-token.reveal-wrong .tag-label { background:#8a4526; }
  .word-token.reveal-missed {
    background-color: rgba(226,84,63,.20);
    text-decoration: underline dashed #e2543f;
    text-underline-offset: 3px;
    color: #f5a89c; font-weight: 600; cursor: default;
  }
  .locked .word-token { cursor: default; }
  .locked .word-token:hover { background-color: transparent; }
  #cat-popover {
    position: absolute;
    z-index: 50;
    min-width: 200px;
    max-height: 320px;
    overflow-y: auto;
    background: #172a47;
    border: 1px solid #2e4a73;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(2,5,12,.55);
    padding: 8px;
  }
  #cat-popover.hidden { display: none; }
  #cat-popover button {
    display: flex; align-items: center; gap: 8px;
    width: 100%; text-align: left;
    padding: 6px 10px; border-radius: 8px;
    font-size: .95rem;
    color: var(--ink);
    transition: background-color .12s ease;
  }
  #cat-popover button:hover { background: rgba(217,164,65,.14); }
  #cat-popover button:focus-visible { outline: 2px solid #d9a441; outline-offset: 1px; }
  .fade-in { animation: fadeIn .4s ease both; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }

  .canva-header { background: linear-gradient(135deg, var(--lapis) 0%, var(--lapis-dark) 100%); }
  .canva-header .canva-text { color: var(--gold); }
  .canva-panel { background: var(--base-panel); border: 1px solid var(--border); }
  .canva-panel .canva-text { color: var(--ink); }
  .canva-section { background: #0b1626; border: 1px solid var(--border); }
  .canva-tag { background: #172a47; border: 1px solid var(--border); color: var(--ink-soft); font-size: .8rem; }
  .canva-button { background: var(--lapis); color: #f5f1e6; }
  .canva-button:hover { background: var(--gold-deep); color: #0a1424; }

  /* ---------- Leaderboard modal ---------- */
  #leaderboard-overlay {
    position: fixed; inset: 0; z-index: 110;
    display: flex; align-items: center; justify-content: center;
    background: rgba(3,6,14, .70);
    padding: 20px;
  }
  #leaderboard-overlay.hidden { display: none; }
  .leaderboard-card {
    width: 100%; max-width: 720px;
    max-height: 84vh;
    background: var(--base-panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(2,5,12,.6);
    padding: 26px 28px 24px;
    display: flex;
    flex-direction: column;
  }
  .leaderboard-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .leaderboard-header h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--gold);
    margin: 0;
  }
  .leaderboard-header button {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color .12s ease;
  }
  .leaderboard-header button:hover { background: rgba(217,164,65,.16); }
  .leaderboard-subtitle {
    color: var(--ink-soft);
    font-size: .88rem;
    margin: 4px 0 16px;
  }
  #leaderboard-body {
    overflow-y: auto;
    overflow-x: auto;
    flex: 1;
  }
  #leaderboard-loading,
  #leaderboard-empty {
    color: var(--ink-soft);
    text-align: center;
    padding: 30px 10px;
    font-size: .95rem;
  }
  #leaderboard-table {
    width: 100%;
    border-collapse: collapse;
    font-size: .92rem;
  }
  #leaderboard-table thead th {
    text-align: left;
    font-family: 'Playfair Display', serif;
    font-size: .72rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--gold-deep);
    border-bottom: 2px solid var(--border);
    padding: 8px 8px;
  }
  #leaderboard-table tbody td {
    padding: 9px 8px;
    border-bottom: 1px solid rgba(46,74,115,.6);
    color: var(--ink);
  }
  #leaderboard-table tbody tr:hover { background: rgba(217,164,65,.08); }
  #leaderboard-table tbody tr.leaderboard-me {
    background: rgba(90,168,140,.16);
    font-weight: 700;
  }

  /* ---------- Result summary modal ---------- */
  /* Shown once, immediately after a reading session finishes, as a
     quick at-a-glance score summary that sits on top of the full
     inline feedback list already on the page. */
  #result-overlay {
    position: fixed; inset: 0; z-index: 120;
    display: flex; align-items: center; justify-content: center;
    background: rgba(3,6,14, .78);
    padding: 20px;
  }
  #result-overlay.hidden { display: none; }
  .result-card {
    position: relative;
    width: 100%; max-width: 460px;
    max-height: 88vh;
    overflow-y: auto;
    background: var(--base-panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 26px 64px rgba(2,5,12,.6);
    padding: 34px 30px 26px;
    text-align: center;
  }
  .result-close-btn {
    position: absolute;
    top: 14px; right: 14px;
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color .12s ease;
  }
  .result-close-btn:hover { background: rgba(217,164,65,.16); }
  .result-icon-wrap {
    width: 58px; height: 58px; margin: 0 auto 14px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--gold), var(--lapis));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 14px rgba(31,78,140,.45);
  }
  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--gold);
    letter-spacing: .02em;
    margin: 0 0 6px;
  }
  .result-student-line {
    color: var(--ink-soft);
    font-size: .92rem;
    margin: 0 0 20px;
  }
  .result-ring-wrap {
    position: relative;
    width: 132px; height: 132px;
    margin: 0 auto 18px;
  }
  .result-ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .result-ring-track {
    fill: none;
    stroke: rgba(46,74,115,.6);
    stroke-width: 10;
  }
  .result-ring-fill {
    fill: none;
    stroke: var(--gold);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 326.7256;
    stroke-dashoffset: 326.7256;
    transition: stroke-dashoffset .8s ease;
  }
  .result-ring-label {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #result-score-percent {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
  }
  .result-ring-caption {
    color: var(--ink-soft);
    font-size: .7rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .result-message {
    color: var(--ink);
    font-size: .98rem;
    margin: 0 0 18px;
  }
  .result-stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .result-stat {
    background: #0a1426;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .result-stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    color: var(--gold);
    font-weight: 700;
  }
  .result-stat-label {
    color: var(--ink-soft);
    font-size: .74rem;
    letter-spacing: .03em;
    text-transform: uppercase;
    text-align: center;
  }
  .result-save-status {
    color: var(--ink-soft);
    font-size: .85rem;
    min-height: 1.2em;
    margin: 0 0 18px;
  }
  .result-save-status.result-save-ok { color: #a7ddc7; }
  .result-save-status.result-save-fail { color: #f5a89c; }
  .result-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  /* ---------- Session Notes (single overall comment box) ---------- */
  /* One free-text box for the teacher's overall observations about the
     whole reading session, filled in whenever it's convenient rather
     than interrupting live tagging with a popup after every word. */
  .session-notes-wrap { margin-bottom: 20px; }
  .session-notes-wrap label {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: .78rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin-bottom: 6px;
  }
  #session-notes {
    width: 100%;
    box-sizing: border-box;
    font-family: 'Noto Serif', serif;
    font-size: .95rem;
    color: var(--ink);
    background: #0a1426;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 13px;
    outline: none;
    resize: vertical;
    min-height: 64px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #session-notes::placeholder { color: #7f93b5; }
  #session-notes:focus {
    border-color: var(--gold-deep);
    box-shadow: 0 0 0 3px rgba(184,134,43,.25);
  }

  /* ---------- Leaderboard per-row reprint icon button ---------- */
  .leaderboard-print-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px 7px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color .12s ease, border-color .12s ease;
  }
  .leaderboard-print-btn:hover {
    background: rgba(217,164,65,.14);
    border-color: var(--gold-deep);
  }

  /* ---------- Custom confirm modal (replaces the native window.confirm) ---------- */
  /* "Finish & Save" used to trigger the browser's own built-in
     window.confirm() dialog -- a plain gray OS-styled popup with a
     generic title bar that visually clashes with the rest of this
     lapis/gold themed app and cannot be restyled at all. This
     modal replaces it with a card that matches the Login screen,
     Leaderboard, and Result Summary modals already in this file, so
     every popup in the app now shares one consistent look. */
  #confirm-overlay {
    position: fixed; inset: 0; z-index: 130;
    display: flex; align-items: center; justify-content: center;
    background: rgba(3,6,14, .78);
    padding: 20px;
  }
  #confirm-overlay.hidden { display: none; }
  .confirm-card {
    width: 100%; max-width: 400px;
    background: var(--base-panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 26px 64px rgba(2,5,12,.6);
    padding: 32px 28px 26px;
    text-align: center;
  }
  .confirm-icon-wrap {
    width: 52px; height: 52px; margin: 0 auto 16px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--gold), var(--lapis));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 14px rgba(31,78,140,.45);
  }
  .confirm-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--gold);
    letter-spacing: .02em;
    margin: 0 0 10px;
  }
  .confirm-message {
    color: var(--ink);
    font-size: .95rem;
    line-height: 1.55;
    margin: 0 0 26px;
  }
  .confirm-actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .confirm-actions button {
    font-family: 'Noto Serif', serif;
    font-size: .92rem;
    border: none;
    cursor: pointer;
  }
  .confirm-actions button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  /* Reuses the same var(--lapis)/var(--gold-deep) pairing as
     .canva-button and .canva-button-outline elsewhere in this file,
     so both confirm-modal buttons keep light text on a solid dark
     fill (or dark text on a bright gold hover) in every state --
     never light text on a light background. */
  .confirm-cancel-btn { background: #172a47; color: var(--ink); border: 1.5px solid var(--border) !important; }
  .confirm-cancel-btn:hover { background: rgba(217,164,65,.14); border-color: var(--gold-deep) !important; }
  .confirm-ok-btn { background: var(--lapis); color: #f5f1e6; }
  .confirm-ok-btn:hover { background: var(--gold-deep); color: #0a1424; }

  /* ---------- Floating reading timer (Start Reading / live elapsed clock) ---------- */
  /* Previously this control lived inline in the toolbar next to the
     "Words tagged" counter, which meant the teacher had to scroll all
     the way back up to press Start Reading, then scroll back down to
     the passage to actually follow along with the student -- by the
     time they scrolled back, the read-aloud had already begun
     un-timed. It now renders as a floating pill fixed to the bottom
     of the viewport (see #timer-fab-wrap below) so it stays on screen
     and one tap away no matter how far down the passage the teacher
     has scrolled. The underlying behavior is unchanged: the teacher
     presses Start Reading the moment the student begins reading
     aloud; the timer keeps running (updating the mm:ss display once a
     second) until "Finish & Save" is pressed, at which point
     script.html stops it automatically and folds the elapsed seconds
     into the WCPM calculation. There is no separate pause control --
     a read-aloud pass is meant to be timed start-to-finish in one
     continuous run, matching how WCPM is measured on a standard Oral
     Reading Fluency (ORF) report. */
  #timer-fab-wrap {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 90;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  #timer-start-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Noto Serif', serif;
    font-size: .92rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--base-panel);
