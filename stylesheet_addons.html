<style>
  /* Additions for the reusable template. Your existing stylesheet.html stays as it is. */

  /* Optional "key words" highlight category (teacher-chosen vocabulary) */
  .sound-tip-row-label.cat-custom { color: #d6b8ff; }
  .sound-word-chip.cat-custom { border-color: rgba(214,184,255,.55); }
  .focus-dot.cat-custom { background: rgba(214,184,255,.95); }
  #passage.show-focus .word-token[data-focus="custom"] { box-shadow: inset 0 -3px 0 rgba(214,184,255,.9); }
  .sound-tip-more { color: var(--ink-soft); font-size: .78rem; align-self: center; }

  /* Rubric save buttons (the three rubrics are now built from one template) */
  .rubric-save-btn {
    font-family: 'Noto Serif', serif; font-size: .85rem; color: var(--ink);
    background: #172a47; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 7px 14px; cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .rubric-save-btn:hover { background: rgba(217,164,65,.14); border-color: var(--gold-deep); }
  .rubric-save-btn:disabled { opacity: .55; cursor: not-allowed; }

  /* Boot / PIN screen messages */
  .boot-msg { color: var(--ink-soft); font-size: .92rem; margin: 0 0 14px; min-height: 1.3em; }
  .boot-msg.boot-error { color: #f5a89c; }

  /* ---------- Student page ---------- */
  .student-page { min-height: 100vh; display: flex; justify-content: center; padding: 22px 14px; }
  .student-stack { width: 100%; max-width: 780px; display: flex; flex-direction: column; gap: 18px; }
  .student-card {
    background: var(--base-panel); border: 1px solid var(--border);
    border-radius: 20px; padding: 26px 26px 24px;
    box-shadow: 0 20px 50px rgba(2,5,12,.45);
  }
  .student-card h2 {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--gold); margin: 0 0 6px;
  }
  .student-card .lead { color: var(--ink-soft); font-size: .9rem; margin: 0 0 18px; line-height: 1.5; }
  .student-title { text-align: center; padding: 6px 0 2px; }
  .student-title h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.5rem; margin: 10px 0 2px; }
  .student-title p { color: var(--ink-soft); font-size: .9rem; margin: 0; }
  .gold-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: 'Playfair Display', serif; letter-spacing: .03em; font-size: .95rem;
    color: #0a1424; background: linear-gradient(135deg, var(--gold) 0%, #7a5614 100%);
    border: none; border-radius: 10px; padding: 12px 20px; cursor: pointer;
    box-shadow: 0 6px 16px rgba(217,164,65,.28);
  }
  .gold-btn:disabled { opacity: .6; cursor: not-allowed; }
  .ghost-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'Noto Serif', serif; font-size: .85rem; color: var(--ink);
    background: none; border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; cursor: pointer;
  }
  .ghost-btn:hover { background: rgba(217,164,65,.14); border-color: var(--gold-deep); }
  .form-msg { min-height: 1.3em; font-size: .88rem; margin: 10px 0 0; color: var(--ink-soft); }
  .form-msg.bad { color: #f5a89c; }
  .form-msg.good { color: #a7ddc7; }
  .table-scroll { overflow-x: auto; }
  .data-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .data-table th {
    text-align: left; font-family: 'Playfair Display', serif; font-size: .74rem; letter-spacing: .05em;
    color: var(--gold-deep); border-bottom: 2px solid var(--border); padding: 8px;
  }
  .data-table td { padding: 9px 8px; border-bottom: 1px solid rgba(46,74,115,.6); color: var(--ink); }
  .data-table tbody tr:hover { background: rgba(217,164,65,.08); }
  .hint-small { color: var(--ink-soft); font-size: .8rem; line-height: 1.5; margin: 8px 0 0; }
  .step-hidden { display: none; }
  @media (max-width: 560px) {
    .student-card { padding: 20px 16px; }
    .data-table { font-size: .8rem; }
  }

  /* Collapsible panels (How to use + word cheat list), closed by default */
  .collapse-panel > summary {
    display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none;
    font-family: 'Playfair Display', serif; font-size: .92rem; letter-spacing: .02em; color: var(--gold);
  }
  .collapse-panel > summary::-webkit-details-marker { display: none; }
  .collapse-panel > summary::after {
    content: ''; margin-left: auto; width: 8px; height: 8px;
    border-right: 2px solid var(--ink-soft); border-bottom: 2px solid var(--ink-soft);
    transform: rotate(45deg); transition: transform .15s ease;
  }
  .collapse-panel[open] > summary::after { transform: rotate(-135deg); }
  .collapse-panel > summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

  /* ---------- Manage screen ---------- */
  #manage-overlay { position: fixed; inset: 0; z-index: 125; display: flex; align-items: center; justify-content: center; background: rgba(3,6,14,.78); padding: 14px; }
  #manage-overlay.hidden { display: none; }
  .manage-card {
    width: 100%; max-width: 820px; max-height: 92vh; display: flex; flex-direction: column;
    background: var(--base-panel); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: 0 24px 60px rgba(2,5,12,.6); padding: 20px 22px 16px;
  }
  .manage-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .manage-head h2 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.25rem; margin: 0; }
  .manage-x { background: none; border: none; color: var(--ink-soft); font-size: 1.6rem; line-height: 1; cursor: pointer; padding: 2px 10px; border-radius: 8px; }
  .manage-x:hover { background: rgba(217,164,65,.16); }
  .manage-tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 14px; }
  .manage-tab {
    font-family: 'Noto Serif', serif; font-size: .9rem; color: var(--ink-soft); background: none;
    border: 1.5px solid var(--border); border-radius: 999px; padding: 6px 16px; cursor: pointer;
  }
  .manage-tab:hover { border-color: var(--gold-deep); }
  .manage-tab.active { background: rgba(217,164,65,.18); border-color: var(--gold-deep); color: #f3dc9f; }
  .manage-body { overflow-y: auto; flex: 1; padding: 2px 4px 8px 2px; }
  .manage-body .lead { color: var(--ink-soft); font-size: .9rem; line-height: 1.5; margin: 0 0 14px; }
  .manage-warn { background: rgba(226,84,63,.14); border: 1px solid #e2543f; color: #f5c3b9; border-radius: 10px; padding: 10px 14px; font-size: .86rem; margin-bottom: 14px; }
  .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .m-sub { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.05rem; margin: 0 0 12px; }
  .m-check { display: flex; align-items: flex-start; gap: 9px; color: var(--ink); font-size: .9rem; margin: 4px 0 12px; cursor: pointer; }
  .m-check input { margin-top: 4px; accent-color: var(--gold); }
  .m-item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: #0a1426; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; }
  .m-item.m-dim { opacity: .6; }
  .m-item-main { display: flex; flex-direction: column; gap: 2px; color: var(--ink); }
  .m-item-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .m-meta { color: var(--ink-soft); font-size: .78rem; font-weight: 400; }
  .m-danger { color: #f5a89c; }
  .m-danger:hover { border-color: #e2543f; background: rgba(226,84,63,.14); }
  .field-group textarea, .data-table input[type="text"], .data-table input[type="number"] {
    width: 100%; box-sizing: border-box; font-family: 'Noto Serif', serif; font-size: .95rem; color: var(--ink);
    background: #0a1426; border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 12px; outline: none;
  }
  .field-group textarea { resize: vertical; line-height: 1.5; }
  .field-group textarea:focus, .data-table input:focus { border-color: var(--gold-deep); box-shadow: 0 0 0 3px rgba(184,134,43,.25); }
  @media (max-width: 640px) { .m-grid { grid-template-columns: 1fr; } .manage-card { padding: 16px 14px 12px; } }
</style>
